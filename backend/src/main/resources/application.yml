spring:
  application:
    name: campus-snack-mall
  profiles:
    active: dev
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:3306/campus_snack_mall?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  jackson:
    default-property-inclusion: non_null
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

server:
  port: 8080

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

jwt:
  secret: ${JWT_SECRET:campus-snack-mall-demo-secret-key-please-change}
  expire-seconds: 7200

upload:
  path: ${UPLOAD_PATH:./upload/}
  access-url-prefix: /upload/

logging:
  level:
    com.campus.snackmall: info
